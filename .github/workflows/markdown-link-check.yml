name: Markdown Link Check

on:
  push:
    branches: [main]
    paths:
      - 'docs/**/*.md'
      - 'runbooks/**/*.md'
      - '*.md'
  pull_request:
    paths:
      - 'docs/**/*.md'
      - 'runbooks/**/*.md'
      - '*.md'

permissions:
  contents: read

jobs:
  link-check:
    name: Check Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Check links in changed Markdown files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "$BASE_SHA"...HEAD -- 'docs/**/*.md' 'runbooks/**/*.md' '*.md')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Markdown files changed; skipping link validation."
            exit 0
          fi

          for file in "${files[@]}"; do
            markdown-link-check --config .github/markdown-link-check-config.json --verbose "$file"
          done
